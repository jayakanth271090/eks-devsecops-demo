name: DevSecOps CI pipeline
on: 
    push:
        branches: ["main"]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Multi-Stage Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{github.sha}} ./app
          docker tag ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest

      - name: run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{github.sha}}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Registry
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest