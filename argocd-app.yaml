apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-prod-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com
    targetRevision: main
    path: k8s
  destination:
    server: https://default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
